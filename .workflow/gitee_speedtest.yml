version: 1.0
name: gitee-overscan-runner
displayName: 'Cloudflare 节点测速推送'

triggers:
  schedule:
    cron: '0 */12 * * *'
  push:
    branches:
      precise:
        - main

stages:
  - stage:
    name: speedtest-and-push
    displayName: '节点测速与推送'
    strategy: naturally
    steps:
      - step: build@python
        name: run-speedtest-and-push
        displayName: '执行测速并推送到分发仓库'
        pythonVersion: 3.11
        commands: |
          set -e
          echo '=== 1. 安装 Python 依赖 ==='
          pip install aiohttp requests -q

          echo '=== 2. 执行测速并生成 Gitee 节点 ==='
          python src/cf_overscan.py --output overNode_gitee.txt --backup-file overNode_gitee_backup.txt --node-tag Gitee --regions US,DE,SG --domain 98k2887114514.28870721.xyz --target-count 6 --min-speed 0.3 --force --no-push
          python src/chain_builder.py --inbound overNode_gitee.txt --output overNode_gitee_chain.txt --backup overNode_gitee_chain_backup.txt || echo 'chain_builder skipped'

          echo '=== 3. 提交推送到 OverNodes-Gitee 仓库 ==='
          TOKEN="${GITEE_TOKEN:-7d23a67953d0e45f43deeabd2e0c2eec}"
          PUSH_URL="https://oauth2:${TOKEN}@gitee.com/ggbodMlgbz/OverNodes-Gitee.git"
          git clone "$PUSH_URL" dist_repo
          cp overNode_gitee.txt dist_repo/overNode_gitee.txt
          if [ -f overNode_gitee_backup.txt ]; then cp overNode_gitee_backup.txt dist_repo/overNode_gitee_backup.txt; fi
          if [ -f overNode_gitee_chain.txt ]; then cp overNode_gitee_chain.txt dist_repo/overNode_gitee_chain.txt; fi
          if [ -f overNode_gitee_chain_backup.txt ]; then cp overNode_gitee_chain_backup.txt dist_repo/overNode_gitee_chain_backup.txt; fi

          cd dist_repo
          git config user.name 'Gitee-Runner-Bot'
          git config user.email 'bot@gitee.com'
          git add overNode_gitee.txt overNode_gitee_backup.txt overNode_gitee_chain.txt overNode_gitee_chain_backup.txt
          git commit -m 'Auto update Gitee nodes' || echo 'No changes to commit'
          git push "$PUSH_URL" main
