[custom]
; 代理组定义 (常用交互组置顶)
custom_proxy_group=🚀 节点选择`select`[]🌐 优选域名`[]🧱 优选IP`[]⚡ 自动选择`[]DIRECT
custom_proxy_group=🤖 Agent`select`[]🌐 优选域名`[]🧱 优选IP`[]🇸🇬 新域优选`[]🇯🇵 日域优选`[]🇺🇸 美域优选`[]🇸🇬 新区IP`[]🇺🇸 美区IP`[]⚡ 自动选择
custom_proxy_group=🌐 优选域名`select`[]⚡ 域名自动`[]🇸🇬 新域优选`[]🇯🇵 日域优选`[]🇺🇸 美域优选`(?i).*(090227|优选域名|cname).*
custom_proxy_group=🧱 优选IP`select`[]⚡ IP自动`[]🇸🇬 新区IP`[]🇺🇸 美区IP`(?i).*(优选ip|直连ip).*
custom_proxy_group=🇸🇬 新域优选`select`[]⚡ 新域自动`(?i).*(SG|新加坡)\s*(电信优选|优选|节点).*
custom_proxy_group=🇯🇵 日域优选`select`[]⚡ 日域自动`(?i).*(JP|日本)\s*(电信优选|优选|节点).*
custom_proxy_group=🇺🇸 美域优选`select`[]⚡ 美域自动`(?i).*(US|美国)\s*(电信优选|优选|节点).*
custom_proxy_group=🇸🇬 新区IP`select`[]⚡ 新区IP自动`(?i).*(sg|新加坡)-.*
custom_proxy_group=🇺🇸 美区IP`select`[]⚡ 美区IP自动`(?i).*(us|美国)-.*
custom_proxy_group=🛑 全球拦截`select`[]REJECT`[]DIRECT

; 底层自动测速与容灾分组 (沉底置于最末，平时无需理会)
custom_proxy_group=⚡ 域名自动`url-test`(?i).*(优选|ms\]|090227|域名).*`http://cp.cloudflare.com/generate_204`300,50,50
custom_proxy_group=⚡ 新域自动`url-test`(?i).*(SG|新加坡)\s*(电信优选|优选|节点).*`http://cp.cloudflare.com/generate_204`300,50,50
custom_proxy_group=⚡ 日域自动`url-test`(?i).*(JP|日本)\s*(电信优选|优选|节点).*`http://cp.cloudflare.com/generate_204`300,50,50
custom_proxy_group=⚡ 美域自动`url-test`(?i).*(US|美国)\s*(电信优选|优选|节点).*`http://cp.cloudflare.com/generate_204`300,50,50
custom_proxy_group=⚡ IP自动`url-test`(?i).*(-\[\d+\]|优选ip).*`http://cp.cloudflare.com/generate_204`300,50,50
custom_proxy_group=⚡ 新区IP自动`url-test`(?i).*(sg|新加坡)-.*`http://cp.cloudflare.com/generate_204`300,50,50
custom_proxy_group=⚡ 美区IP自动`url-test`(?i).*(us|美国)-.*`http://cp.cloudflare.com/generate_204`300,50,50
custom_proxy_group=⚡ 自动选择`url-test`[]🌐 优选域名`[]🧱 优选IP`http://cp.cloudflare.com/generate_204`300,50,50

; 分流规则集
ruleset=DIRECT,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/LocalAreaNetwork.list
ruleset=🛑 全球拦截,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/BanAD.list

