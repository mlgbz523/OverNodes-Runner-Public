[custom]
; 自定义前置代理 S5 节点 (强制经由新加坡节点中转)
custom_proxy=S5`socks5`107.150.41.226`18080`udp=false`dialer-proxy=🇸🇬 新加坡节点

; 代理组定义
custom_proxy_group=🚀 节点选择`select`[]🇸🇬 新加坡节点`[]⚡ 自动选择`[]🇺🇸 美国节点`[]S5`[]DIRECT
custom_proxy_group=⚡ 自动选择`fallback`[]🇸🇬 新加坡节点`[]🇺🇸 美国节点`[]S5`http://cp.cloudflare.com/generate_204`30,,3
custom_proxy_group=🇸🇬 新加坡节点`fallback`(?i).*(sg|新加坡|🇸🇬).*`http://cp.cloudflare.com/generate_204`30,,3
custom_proxy_group=🇺🇸 美国节点`fallback`(?i).*(us|美国|🇺🇸).*`http://cp.cloudflare.com/generate_204`30,,3
custom_proxy_group=🛑 全球拦截`select`[]REJECT`[]DIRECT

