[custom]
; 自定义 S5 实体节点 (Subconverter 单行字典语法，注入 dialer-proxy 前置代理)
custom_proxy={name: S5, type: socks5, server: 107.150.41.226, port: 18080, dialer-proxy: "🇸🇬 新加坡节点"}

; 代理组定义
custom_proxy_group=🚀 节点选择`select`[]🇸🇬 新加坡节点`[]🇺🇸 美国节点`[]⚡ 自动选择`[]S5`[]DIRECT
custom_proxy_group=⚡ 自动选择`fallback`(?i).*(sg|新加坡|us|美国|s5).*`http://cp.cloudflare.com/generate_204`30,,3
custom_proxy_group=🇸🇬 新加坡节点`select`[]⚡ 自动选择`(?i).*(sg|新加坡|🇸🇬).*
custom_proxy_group=🇺🇸 美国节点`select`[]⚡ 自动选择`(?i).*(us|美国|🇺🇸).*
custom_proxy_group=S5`select`[]⚡ 自动选择`(?i).*(S5).*

custom_proxy_group=🤖 AI 专线`select`[]🇸🇬 新加坡节点`[]🇺🇸 美国节点`[]S5`[]⚡ 自动选择
