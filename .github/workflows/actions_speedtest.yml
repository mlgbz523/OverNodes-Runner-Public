name: Cloudflare Private Speedtest Runner

on:
  workflow_dispatch:
  # schedule:
  #   - cron: '0 0,8,16 * * *' # 已迁移至公开仓库 OverNodes-Runner-Public 每小时执行，私有仓库停用定时调度以节省分钟数

jobs:
  speedtest-and-dispatch:
    name: Private Runner & Dispatch
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: 检出私有测速仓库代码
        uses: actions/checkout@v4

      - name: 检出公开分发仓库
        uses: actions/checkout@v4
        with:
          repository: mlgbz523/OverNodes
          token: ${{ secrets.DISPATCH_PAT }}
          path: public_repo
          fetch-depth: 1

      - name: 初始化 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装运行时依赖
        run: |
          python -m pip install --upgrade pip
          pip install aiohttp

      - name: 1. SOCKS5 公网主动探知扫描与高带宽压测优选 (与在岗节点竞争择优)
        run: |
          python src/socks5_scanner.py \
            --output socks5.txt \
            --existing-file public_repo/socks5.txt \
            --count 2 \
            --concurrency 100 \
            --timeout 4.0 \
            --min-speed 0.3 \
            --allowed-countries US || python src/socks5_preflight.py --current "107.150.41.226:18080" --output socks5.txt --existing-file public_repo/socks5.txt

      - name: 2. 执行入站优选测速探针 (每端口独立精选 + 下载节点提纯)
        env:
          PROBE_DOMAIN: ${{ secrets.PROBE_DOMAIN }}
        run: |
          if [ -z "$PROBE_DOMAIN" ]; then
            echo "::error::PROBE_DOMAIN Secret is not set!"
            exit 1
          fi
          python src/cf_overscan.py \
            --existing-file public_repo/overNode_actions.txt \
            --output overNode_actions.txt \
            --backup-file overNode_actions_backup.txt \
            --download-output overNode_download.txt \
            --node-tag Actions \
            --regions SG,US \
            --domain "$PROBE_DOMAIN" \
            --target-count 6 \
            --min-speed 0.5 \
            --force \
            --no-push

      - name: 3. 执行链式订阅装配合成与聚合质量验证 (端到端实测最优排序)
        run: |
          python src/chain_builder.py \
            --inbound overNode_actions.txt,docs/ips_cfOverScan.txt \
            --socks5 socks5.txt \
            --output overNode_chain.txt \
            --backup overNode_chain_backup.txt \
            --inbound-regions SG,US \
            --allowed-countries US \
            --chain-ports 443,8443 \
            --verify

      - name: 4. 跨仓库推送到公开分发仓库 (含下载专用优选节点)
        run: |
          has_updates=0
          if [ -f overNode_actions.txt ]; then
            cp overNode_actions.txt public_repo/overNode_actions.txt
            [ -f overNode_actions_backup.txt ] && cp overNode_actions_backup.txt public_repo/overNode_actions_backup.txt
            has_updates=1
          fi

          if [ -f overNode_download.txt ]; then
            cp overNode_download.txt public_repo/overNode_download.txt
            has_updates=1
          fi

          if [ -f socks5.txt ]; then
            cp socks5.txt public_repo/socks5.txt
            [ -f socks5_backup.txt ] && cp socks5_backup.txt public_repo/socks5_backup.txt
            has_updates=1
          fi

          if [ -f overNode_chain.txt ]; then
            cp overNode_chain.txt public_repo/overNode_chain.txt
            [ -f overNode_chain_backup.txt ] && cp overNode_chain_backup.txt public_repo/overNode_chain_backup.txt
            has_updates=1
          fi

          if [ -f ACL4SSR_Custom_Advanced.ini ]; then
            cp ACL4SSR_Custom_Advanced.ini public_repo/ACL4SSR_Custom_Advanced.ini
            has_updates=1
          fi

          if [ "$has_updates" -eq 1 ]; then
            cd public_repo
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add overNode_actions.txt socks5.txt overNode_chain.txt ACL4SSR_Custom_Advanced.ini
            [ -f overNode_actions_backup.txt ] && git add overNode_actions_backup.txt
            [ -f overNode_download.txt ] && git add overNode_download.txt
            [ -f socks5_backup.txt ] && git add socks5_backup.txt
            [ -f overNode_chain_backup.txt ] && git add overNode_chain_backup.txt

            if git diff --staged --quiet; then
              echo "[+] 节点、下载专线、SOCKS5 与链式订阅内容无变动，无需推送。"
            else
              git commit -m "Auto-update Cloudflare nodes, download nodes, SOCKS5 & Chain subscriptions: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
              git push origin main
              echo "[+] 🚀 跨仓库推送成功！公开订阅、下载专线、SOCKS5 与链式装配已实时同步。"
            fi
          else
            echo "[-] 测速未生成结果文件！"
            exit 1
          fi
