[custom]
;; ===================================================================
;;  OverNode 定制化分流规则集 (CF 直连 [新/美] × 固定美国 SOCKS5 双轨分组)
;;
;;  节点分组逻辑：
;;    🚀 节点选择    - 总入口，可手动选择下级组
;;    ⚡ 自动选择    - 全部 S5 链式节点自动测速择优
;;    🌐 CF优选组     - 纯 Cloudflare 优选 IP 直连（新加坡 / 美国）
;;    🌐 CF优选组  - 纯净新加坡 Cloudflare 优选直连（极速低延迟）
;;    🌐 CF优选组    - 纯净美国 Cloudflare 优选直连（大带宽直出）
;;    🛰️ SOCKS5 节点 - 全部 SOCKS5 链式中继节点
;;    🛰️ SOCKS5 节点    - 专属固定美国 SOCKS5 链式节点 (AI 业务专用落地)
;; ===================================================================

;; ======================== 代理组定义 ========================

;; 1. 总入口：手动从下级组中选择
custom_proxy_group=🚀 节点选择`select`[]⚡ 自动选择`[]🌐 CF优选组`[]🤖 AI 专线`[]✈️ Telegram`[]🛰️ SOCKS5 节点`[]⚖️ 负载均衡`[]🛡️ 故障转移`[]🎛️ 手动切换`[]DIRECT

;; 2. 自动选择：包含直连与链式节点，自动测速
custom_proxy_group=⚡ 自动选择`url-test`(?i).*(优选|S5_).*`http://cp.cloudflare.com/generate_204`300,50,50

;; 3. CF 优选组：匹配所有的 US/SG 优选直连节点
custom_proxy_group=🌐 CF优选组`url-test`(?i).*(优选).*`http://cp.cloudflare.com/generate_204`300,50,50

;; 4. SOCKS5 节点：匹配所有的 S5 链式节点
custom_proxy_group=🛰️ SOCKS5 节点`select`(?i).*(S5_).*

;; 5. AI 专线：使用 fallback，优先所有 S5 节点，回退到 CF 优选组
custom_proxy_group=🤖 AI 专线`fallback`(?i).*(S5_).*`[]🌐 CF优选组`http://cp.cloudflare.com/generate_204`300

;; 6. Telegram 专属：CF 优选大带宽首选 (超低延迟与极速并发)，可选负载均衡/自动测速/S5
custom_proxy_group=✈️ Telegram`select`[]🌐 CF优选组`[]⚡ 自动选择`[]⚖️ 负载均衡`[]🛰️ SOCKS5 节点`[]DIRECT

;; 7. 国外媒体：CF 优选组优先，回退到 S5
custom_proxy_group=🎬 国外媒体`select`[]🌐 CF优选组`[]🛰️ SOCKS5 节点`[]DIRECT

;; 8. 网盘下载：CF 优选组拉满
custom_proxy_group=📥 网盘下载`select`[]🌐 CF优选组`[]DIRECT

;; 9. 社交软件：Telegram/CF 优选组优先
custom_proxy_group=💬 社交软件`select`[]✈️ Telegram`[]🌐 CF优选组`[]⚡ 自动选择`[]🛰️ SOCKS5 节点`[]DIRECT

;; 9. GitHub：CF 优选组优先
custom_proxy_group=🐙 GitHub`select`[]🌐 CF优选组`[]🛰️ SOCKS5 节点`[]DIRECT

;; 10. Steam 服务
custom_proxy_group=🎮 Steam 服务`select`[]🌐 CF优选组`[]DIRECT

;; 11. 甲骨文服务
custom_proxy_group=🏛️ 甲骨文服务`select`[]🌐 CF优选组`[]DIRECT

;; ---- 通用辅助组 ----

;; 负载均衡：全部 S5 + 直连节点
custom_proxy_group=⚖️ 负载均衡`load-balance`(?i).*(S5_|优选).*`http://cp.cloudflare.com/generate_204`300,,consistent-hashing

;; 故障转移
custom_proxy_group=🛡️ 故障转移`fallback`(?i).*(S5_|优选).*`http://cp.cloudflare.com/generate_204`300

;; 手动切换：所有节点
custom_proxy_group=🎛️ 手动切换`select`.*

;; 全球直连
custom_proxy_group=🎯 全球直连`select`[]DIRECT`[]🚀 节点选择

;; 全球拦截
custom_proxy_group=🛑 全球拦截`select`[]REJECT`[]DIRECT

;; 漏网之鱼
custom_proxy_group=🐟 漏网之鱼`select`[]🚀 节点选择`[]⚡ 自动选择`[]🎯 全球直连

;; ======================== 分流规则集 ========================

